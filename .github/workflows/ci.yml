name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev and viz extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"
      - name: Verify CLI entry points
        run: |
          saturation-mutagenesis --help > /dev/null
          partial-diffusion --help > /dev/null
          boltz-cofold --help > /dev/null
          contact-analysis --help > /dev/null
          enzyme-geometry --list-mechanisms > /dev/null
      - name: Run offline test suite
        run: pytest -v
      - name: Run offline end-to-end demo
        run: python examples/run_offline_demo.py --out-dir /tmp/demo_out
